name: Validate application and API v1
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rxm_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: rxm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rxm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgres://rxm_test:local_ci_only@127.0.0.1:5432/rxm_test
      INTEGRATION_TEST_DATABASE_URL: postgres://rxm_test:local_ci_only@127.0.0.1:5432/rxm_test
      INTEGRATION_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run integration:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
